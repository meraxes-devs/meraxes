name: Run clang-format Linter

on: [push, pull_request]

permissions:
  contents: read

jobs:
  # Fails on unformatted code, showing the diff to apply, instead of committing the fix:
  # the bot's commits didn't trigger the tests, so a PR whose newest commit was the bot's
  # never got the required "All tests passed" check. Run tools/format.sh before pushing
  # (or enable the pre-commit hook: git config core.hooksPath .githooks).
  clang-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The runner's own clang-format is a newer version, which formats differently.
      - name: Install clang-format 14
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install -q clang-format==14.0.6
          echo "CLANG_FORMAT=$RUNNER_TEMP/clang-format/bin/clang-format" >> "$GITHUB_ENV"

      - name: Check formatting
        run: tools/format.sh --check

<text x="577.5" y="490" text-anchor="middle" class="heading">Escaped radiation</text>
<text x="577.5" y="513" text-anchor="middle" class="body">Ionizing stellar and AGN photons</text>
<text x="577.5" y="532" text-anchor="middle" class="body">X-rays when enabled</text>
<rect x="810" y="465" width="285" height="100" rx="8" fill="#EFF8F5" stroke="#278470" stroke-width="1.6"/>
<text x="952.5" y="490" text-anchor="middle" class="heading">IGM evolution</text>
<text x="952.5" y="513" text-anchor="middle" class="body">Hydrogen ionization</text>
<text x="952.5" y="532" text-anchor="middle" class="body">Thermal and radiation history</text>

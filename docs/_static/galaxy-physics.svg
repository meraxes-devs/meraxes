<text x="192.5" y="273" text-anchor="middle" class="body">Infall; reincorporation</text>
<text x="192.5" y="292" text-anchor="middle" class="body">Cooling: hot → cold gas</text>
<text x="192.5" y="311" text-anchor="middle" class="body">Enrichment and ejection</text>
<rect x="35" y="465" width="315" height="100" rx="8" fill="#FCF6EB" stroke="#BA7D25" stroke-width="1.6"/>
<text x="192.5" y="490" text-anchor="middle" class="heading">Star formation</text>
<text x="192.5" y="513" text-anchor="middle" class="body">Disk star formation and merger bursts</text>
<text x="192.5" y="532" text-anchor="middle" class="body">Stellar populations and recycling</text>
<rect x="435" y="225" width="285" height="110" rx="8" fill="#FCF6EB" stroke="#BA7D25" stroke-width="1.6"/>
<text x="577.5" y="250" text-anchor="middle" class="heading">Black holes and AGN</text>
<text x="577.5" y="273" text-anchor="middle" class="body">Hot- and cold-mode accretion</text>
<text x="577.5" y="292" text-anchor="middle" class="body">Enabled radiative sources</text>

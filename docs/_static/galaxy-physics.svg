<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 700" role="img" aria-labelledby="title desc">
<title id="title">Galaxy physics and radiation feedback</title><desc id="desc">Gas supply and cooling feed star formation and black holes; stellar and UV background feedback couple the galaxy and intergalactic calculations.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#203344} .heading{font-weight:700;font-size:17px} .body{font-size:14px} .label{font-size:13px}</style>
<rect width="1150" height="700" fill="white"/>
<rect x="35" y="25" width="315" height="90" rx="8" fill="#F1F6FC" stroke="#427CC0" stroke-width="1.6"/>
<text x="192.5" y="50" text-anchor="middle" class="heading">Halo assembly</text>
<text x="192.5" y="73" text-anchor="middle" class="body">Growth, host changes and mergers</text>
